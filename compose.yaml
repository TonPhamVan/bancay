name: bancay
services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    image: bancay-php:8.3
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    environment:
      COMPOSER_HOME: /tmp/composer
      DB_HOST: db
    ports:
      - "127.0.0.1:${APP_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
  db:
    image: mariadb:10.11
    environment:
      MARIADB_DATABASE: bancay
      MARIADB_USER: bancay
      MARIADB_PASSWORD: ${DB_PASSWORD:?Generate a private local .env first}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Generate a private local .env first}
    volumes:
      - bancay_database:/var/lib/mysql
      - ./docker/mariadb/init-testing.sql:/docker-entrypoint-initdb.d/20-testing.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 3s
      timeout: 5s
      retries: 30
    # No database port is published to the host.
  assets:
    image: node:24-bookworm-slim
    profiles: ["tools"]
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    working_dir: /workspace
    volumes:
      - .:/workspace
    environment:
      npm_config_cache: /tmp/npm-cache
    command: ["sh", "-c", "npm ci && npm run build"]
volumes:
  bancay_database:
